<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="background-color: blueviolet; color: red;">Student Login</title>
</head>
<body>
    <h1 style="background-color: white; color: red;">Student Login</h1> 

    <form>
        <label for="email">Student Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your student email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <br><br>

        <button type="submit" style="background-color: green; color: white;">Login</button>
        <button type="reset" style="background-color: lightgray; color: black;">Reset</button>
    </form>

    <br>
    <a href="Forms.html">Back to Registration Form</a>
</body>
</html>
