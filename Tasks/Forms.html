<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Registration Form</title>
</head>
<body>
 <h1  style="color: blue;">Student Registration Form</h1>

 <form>

        <label >Full Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">
        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter password">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <button type="submit" style="background-color: green; color: white;">Submit</button>

        <button type="reset" style="background-color: lightgray; color: black;">Reset</button>

    </form>

    <br>

    <a href="login.html">
        <button type="button">Go to Login Page</button>
    </a>

</body>
</html>
