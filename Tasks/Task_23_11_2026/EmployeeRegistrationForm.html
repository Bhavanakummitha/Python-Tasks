<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="Employee.css">
</head>
<body>

    <div class="container">
        <h2>Employee Registration Form</h2>
        <p style="color: red; ">*Please fill in the employee details below.</p>

        <form>
            <h3>Personal Information</h3>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <br>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>
            <br>
            <div class="form-group">
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <br>

            <div class="form-group">
                <label>Upload Profile Photo</label>
                <input type="file" accept="image/*">
            </div>
            <br>
            <h3>Contact Information</h3>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <br>
          
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>
            </div>
            <br>
            <div class="form-group">
                <label>Address</label>
                <textarea placeholder="Enter your address" rows="3"></textarea>
            </div>
            <br>

            <h3>Job Information</h3>

            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" placeholder="Enter employee ID" required>
            </div>
            <br>

            <div class="form-group">
                <label>Department</label>
                <select required>
                    <option value="">Select Department</option>
                    <option>IT</option>
                    <option>HR</option>
                    <option>Finance</option>
                    <option>Marketing</option>
                    <option>Sales</option>
                </select>
            </div>
            <br>
            <div class="form-group">
                <label>Designation</label>
                <input type="text" placeholder="Enter designation">
            </div>
            <br>
            <div class="form-group">
                <label>Date of Joining</label>
                <input type="date" required>
            </div>
            <br>
            <div class="form-group">
                <label>Employment Type</label>
                <select>
                    <option value="">Select Employment Type</option>
                    <option>Full-Time</option>
                    <option>Part-Time</option>
                    <option>Intern</option>
                    <option>Contract</option>
                </select>
            </div>
            <br>
            <div class="form-group">
                <label>Salary</label>
                <input type="number" placeholder="Enter monthly salary">
            </div>
            <br>
            <div class="buttons">
                <button type="submit">Register Employee</button>
                <button type="reset" class="reset">Clear Form</button>
            </div>

        </form>
    </div>

</body>
</html>
